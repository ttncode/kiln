name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      # kiln writes its own bash since the push floor (D90), which is D26's condition for this.
      - run: shellcheck lib/floor/pre-push.sh skills/kiln-brainstorming/scripts/*.sh scripts/dna-parity/run.sh
      - run: npm test
