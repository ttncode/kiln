name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      # No lockfile is committed while the only dependency is the linter, so
      # `npm ci` has nothing to install from.
      - run: npm install --no-audit --no-fund
      - run: npm run lint
      - run: npm test
