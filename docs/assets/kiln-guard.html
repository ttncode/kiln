<title id="kiln-guard-title">How kiln judges a tool call</title>
<desc id="kiln-guard-desc">Every Edit, Write or Bash call passes a PreToolUse hook whose guards read the work state; exit 0 lets the call run, exit 2 blocks it and returns the reason to the agent.</desc>

<text x="724" y="216" fill="#7a8399" font-size="8" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">EXIT 2</text>

<text x="552" y="186" fill="#4f5d75" font-size="9" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">lib/guards/</text>

<text x="36" y="388" fill="#4f5d75" font-size="8" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start" letter-spacing="0.14em">LEGEND</text>
<rect x="120" y="380" width="24" height="16" rx="3" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
<text x="152" y="392" fill="#4f5d75" font-size="9" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">kiln code</text>

<text x="288" y="392" fill="#4f5d75" font-size="9" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">state the agent cannot write</text>
<line x1="508" y1="388" x2="540" y2="388" stroke="#4f5d75" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
<text x="552" y="392" fill="#4f5d75" font-size="9" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">the block is the message, not an obstacle</text>
